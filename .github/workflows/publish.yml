name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    permissions:
      contents: read
    uses: donuk/github-build-to-dockerhub/.github/workflows/docker-publish.yml@9fa18073ee8b6da38a358600f70171f029fa832f # master@2026-11-17
    with:
      image_name: donuk/httpurlbasedproxy
      test_script: |
        export PROXY_BACKEND_1=/docker:http://127.0.0.1:8080
        export PROXY_BACKEND_2=/duck:http://127.0.0.1:8081/duck/
        /docker-entrypoint.sh nginx -t
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
